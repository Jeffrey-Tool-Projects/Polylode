name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      # the .NET 10 runtime the program carries for AnimeStudio and the Wuthering Waves reader
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest tests -q
      # Nuitka's compiled C objects: a later build only compiles what changed
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ hashFiles('requirements*.txt') }}-${{ github.sha }}
          restore-keys: nuitka-${{ hashFiles('requirements*.txt') }}-
      - name: Build (Nuitka, then the packaged program's own selftest)
        run: python build.py --jobs 4 --dotnet "$env:DOTNET_ROOT"
      - name: Package
        id: package
        run: |
          $version = "0.1.${{ github.run_number }}"
          Compress-Archive -Path dist\Polylode -DestinationPath "Polylode-$version-windows-x64.zip"
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: Polylode ${{ steps.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: Polylode-${{ steps.package.outputs.version }}-windows-x64.zip
