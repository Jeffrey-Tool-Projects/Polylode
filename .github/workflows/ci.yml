name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: windows-latest
    env:
      # no GPU on the runner: Qt's OpenGL is the software one (opengl32sw.dll); the tests draw nothing
      # and run on the offscreen platform, the selftest needs the windows one (offscreen has no OpenGL)
      QT_OPENGL: software
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check --select F,E9 polylode tests tools build.py main.py
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: Selftest from the checkout
        run: |
          # from a checkout Qt looks for opengl32sw.dll on PATH, not in PySide6's folder
          $env:PATH = "$(python -c 'import PySide6, os; print(os.path.dirname(PySide6.__file__))');$env:PATH"
          python -m polylode.extractor --selftest selftest.json
          Get-Content selftest.json
